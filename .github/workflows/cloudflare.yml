name: Cloudflare tiles

# Everything Cloudflare in ONE workflow: started by hand, and once a day by
# the "Variant A live" cycle that ends in the afternoon (workflow_call, job
# "tiles" there -- the forecast the next day is planned with). Each run is
# ~19 000 R2 writes, so once a day stays inside Cloudflare's free plan.
# Nothing else in the repository touches Cloudflare.
#
#   deploy_worker  test and deploy the Worker (tiles/worker). Needed once, and
#                  again after a change to the Worker or the app's SNOWPACK
#                  engine (pipeline/interactive_export.py).
#   publish        take the newest live cycle (or the committed demo), build
#                  the overview tiles, pre-render sharp tiles for a window
#                  around now here in GitHub Actions (then the Cloudflare free
#                  plan is enough: the Worker only serves), upload to R2 and
#                  write the "tiles" block. The site is then redeployed
#                  automatically ("Build and deploy" follows this workflow).
#
# Needs: secrets R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#        CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID;
#        variable TILES_BASE_URL (the Worker's URL; optional R2_BUCKET).

on:
  workflow_dispatch:
    inputs:
      deploy_worker:
        description: "Deploy the Worker (only needed after Worker / engine changes)"
        type: boolean
        default: false
      publish:
        description: "Publish tiles for the chosen export"
        type: boolean
        default: true
      source:
        description: "Which export: the newest live cycle, or the committed demo"
        type: choice
        options: [live, demo]
        default: live
      prerender_hours:
        description: "Pre-render sharp tiles for this many hours around now (0 = none; ~2 min CPU per frame)"
        default: "24"
      views:
        description: "Views to pre-render (comma separated: ski6,powder,wind,density,ski18)"
        default: "ski6,powder"
      on_demand:
        description: "Let the Worker render missing tiles itself (only with Workers Paid)"
        type: boolean
        default: false
      prerender_shift:
        description: "Centre the pre-render window this many hours after now"
        default: "0"
  # the daily run, from the live cycle itself: its export is an artifact of
  # the same run, and a tile failure must never hold back the forecast
  workflow_call:
    inputs:
      deploy_worker: {type: boolean, default: false}
      publish: {type: boolean, default: true}
      source: {type: string, default: live}
      prerender_hours: {type: string, default: "24"}
      views: {type: string, default: "ski6,powder"}
      on_demand: {type: boolean, default: false}
      prerender_shift: {type: string, default: "0"}
      same_run: {type: boolean, default: false}

permissions:
  contents: write        # demo: commit the manifest with the tiles block
  actions: read          # live: download the newest va-live artifact

concurrency:
  group: cloudflare-tiles
  cancel-in-progress: false

jobs:
  worker:
    if: inputs.deploy_worker
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Build the app (offline) and cut the engine out of it
        run: |
          mkdir -p dist
          python run_interactive.py --split --offline --date 2026-04-01 --res 4000 --out-dir dist
          python tools/make_va_engine.py dist/app.js tiles/worker/src/va_engine.js
      - name: Install worker dependencies
        working-directory: tiles/worker
        run: npm ci --no-audit --no-fund
      - name: Test against the committed demo export
        working-directory: tiles/worker
        run: node test/test_worker.mjs ../../variant_a_export
      - name: Deploy to Cloudflare
        working-directory: tiles/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # the Worker's cron starts the live cycles on time with it (see
          # scheduled() in tiles/worker/src/index.js); optional
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set"; exit 1; fi
          npx wrangler deploy
          if [ -n "$GH_DISPATCH_TOKEN" ]; then
            printf '%s' "$GH_DISPATCH_TOKEN" | npx wrangler secret put GH_DISPATCH_TOKEN
          else
            echo "::warning::GH_DISPATCH_TOKEN not set -- the live cycles keep running on GitHub's own (late) schedule"
          fi

  publish:
    needs: worker
    # runs when asked, after the Worker deploy if that was asked too (and
    # not after a failed one)
    if: always() && inputs.publish && needs.worker.result != 'failure' && needs.worker.result != 'cancelled'
    # called from the live cycle: a tile failure must not fail that run (the
    # site deploy follows it only on success, and would hold the forecast)
    continue-on-error: ${{ inputs.same_run == true }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          cd tiles/worker && npm ci --no-audit --no-fund --omit=dev

      - name: Get the export (this run's)
        if: inputs.same_run
        uses: actions/download-artifact@v4
        with:
          name: va-live
          path: export

      - name: Get the export
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.same_run }}" = "true" ]; then
            echo "EXPORT=export" >> "$GITHUB_ENV"; echo "RUN=live-${{ github.run_id }}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.source }}" = "live" ]; then
            RID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=va-live&per_page=20" \
                  --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.created_at) | last | .workflow_run.id // empty')
            [ -n "$RID" ] || { echo "::error::no live cycle artifact (va-live) found"; exit 1; }
            mkdir -p export && gh run download "$RID" -n va-live -D export
            echo "EXPORT=export" >> "$GITHUB_ENV"; echo "RUN=live-${{ github.run_id }}" >> "$GITHUB_ENV"
          else
            echo "EXPORT=variant_a_export" >> "$GITHUB_ENV"; echo "RUN=demo-${{ github.run_id }}" >> "$GITHUB_ENV"
          fi
          python -c "import json;m=json.load(open('$( [ "${{ inputs.source }}" = live ] && echo export || echo variant_a_export )/manifest.json'));print(len(m['tags']),'frames, views',list(m['layers']))"

      - name: Pre-render sharp tiles
        if: inputs.prerender_hours != '0'
        continue-on-error: ${{ inputs.same_run == true }}
        run: |
          mkdir -p dist
          python run_interactive.py --split --offline --date 2026-04-01 --res 4000 --out-dir dist
          python tools/make_va_engine.py dist/app.js tiles/worker/src/va_engine.js
          node tiles/worker/prerender.mjs "$EXPORT" tilecache --views "${{ inputs.views }}" \
               --hours "${{ inputs.prerender_hours }}" --shift "${{ inputs.prerender_shift || '0' }}" --procs "$(nproc)"
          du -sh tilecache
          echo "TILES_CACHE_DIR=$PWD/tilecache" >> "$GITHUB_ENV"

      - name: Upload to R2 and write the tiles block
        id: upload
        continue-on-error: ${{ inputs.same_run == true }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          TILES_BASE_URL: ${{ vars.TILES_BASE_URL }}
          TILES_ON_DEMAND: ${{ inputs.on_demand }}
          TILES_KEEP_RUNS: ${{ inputs.source == 'demo' && '2' || '3' }}
        run: |
          python tools/publish_tiles.py "$EXPORT" "$RUN"
          python -c "import json;t=json.load(open('$EXPORT/manifest.json')).get('tiles');print(json.dumps(t)[:400] if t else 'NO tiles block -- see the tiles: lines above (secrets / upload)');exit(0 if t else 1)"

      # The deploy takes the newest va-live artifact: this one, with tiles.
      # (Called from the live cycle it replaces that run's own va-live.)
      - name: Republish the live export with tiles
        if: inputs.source == 'live' && steps.upload.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: va-live
          path: export/
          retention-days: 5
          overwrite: true

      - name: Commit the demo manifest with tiles
        if: inputs.source == 'demo'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add variant_a_export/manifest.json
          git commit -m "variant_a: demo export served from the tile service ($RUN)" || exit 0
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### Cloudflare tiles (${{ inputs.source }})"
            echo "- run: \`$RUN\`, pre-render: ${{ inputs.prerender_hours }} h (${{ inputs.views }}), on demand: ${{ inputs.on_demand }}"
            [ -f tilecache/sharp.json ] && echo "- frames pre-rendered: $(python -c "import json;print(sum(len(v) for v in json.load(open('tilecache/sharp.json')).values()))")"
            echo "- the site is redeployed automatically (Build and deploy follows this run)"
          } >> "$GITHUB_STEP_SUMMARY"
