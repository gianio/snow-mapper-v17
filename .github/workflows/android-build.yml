name: Android build (Google Play)

# The Android twin of ios-testflight.yml. Same web build, same Capacitor
# project (apple-app/), same capacitor.config.ts -- only the native shell
# differs. Like ios/, android/ is NOT in the repo: Capacitor generates it on
# every run and scripts/apply-android-config.py configures it.
#
# On every pull request that touches the app it builds a debug APK (install it
# on any Android phone straight from the run's artifacts) and smoke-tests it
# on an emulator. Run it by hand with `upload: true` to get a signed .aab and
# send it to the Play Console internal testing track.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "apple-app/**"
      - "pipeline/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign a release .aab and upload it to Play internal testing (needs the secrets)"
        type: boolean
        default: false
      offline:
        description: "Build with synthetic weather instead of live data"
        type: boolean
        default: false
      remote_data_base:
        description: "Origin the shipped app fetches fresh forecast data from"
        type: string
        default: "https://gianio.github.io/snow-mapper-v17"
      version:
        description: "versionName shown in Google Play (keep equal to the iOS version)"
        type: string
        default: "1.0.0"
      build_number:
        description: "versionCode (empty = this workflow's run number; must grow with every upload)"
        type: string
        default: ""

# Secrets required for upload: true
#   ANDROID_KEYSTORE_BASE64      base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD    its store password
#   ANDROID_KEY_ALIAS            the key alias inside it
#   ANDROID_KEY_PASSWORD         the key password
#   PLAY_SERVICE_ACCOUNT_JSON    Google Cloud service-account JSON with access
#                                to the app in Play Console (Users & permissions)
# The very first .aab must be uploaded by hand in Play Console (the API cannot
# create the app); after that this workflow can do every upload.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A PR build has no inputs: offline data, live-data origin as default.
      SNOW_OFFLINE: ${{ (github.event_name == 'pull_request' || inputs.offline) && '1' || '0' }}
      SNOW_REMOTE_DATA_BASE: ${{ inputs.remote_data_base || 'https://gianio.github.io/snow-mapper-v17' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      # Capacitor 8 needs Node 22 and Java 21.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgdal-dev libproj-dev gdal-bin

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Android config script test
        run: python tools/test_android_config.py

      # Same pipeline as the website and the iOS app -- one source.
      - name: Build web assets into apple-app/www
        working-directory: apple-app
        run: |
          npm ci
          npm run build:web

      - name: Validate the built web assets
        run: |
          python tools/check_inline_js.py apple-app/www/index.html
          node --check apple-app/www/app.js

      - name: Generate icon + splash from the brand artwork
        working-directory: apple-app
        run: python3 scripts/make-resources.py

      - name: Generate the native Android project
        working-directory: apple-app
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Apply Android config (permissions, portrait, version, signing)
        working-directory: apple-app
        run: |
          BUILD="${{ inputs.build_number }}"
          [ -n "$BUILD" ] || BUILD="${{ github.run_number }}"
          python3 scripts/apply-android-config.py --version "${{ inputs.version || '1.0.0' }}" --build "$BUILD"

      - name: Build debug APK
        working-directory: apple-app/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Keep the debug APK (install on any Android phone)
        uses: actions/upload-artifact@v4
        with:
          name: snowmapper-debug-apk
          path: apple-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Decode the upload keystore
        if: ${{ inputs.upload }}
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::upload=true but ANDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release bundle (.aab)
        if: ${{ inputs.upload }}
        working-directory: apple-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Keep the signed .aab
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: snowmapper-release-aab
          path: apple-app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      # Skipped (not failed) until PLAY_SERVICE_ACCOUNT_JSON exists: the very
      # first .aab has to be uploaded by hand anyway (see README).
      - name: Check for Play Console access
        if: ${{ inputs.upload }}
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "HAS_PLAY=true" >> "$GITHUB_ENV"
          else echo "::notice::PLAY_SERVICE_ACCOUNT_JSON not set -- upload the .aab artifact by hand in Play Console."; fi

      - name: Upload to Play Console (internal testing)
        if: ${{ inputs.upload && env.HAS_PLAY == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ch.snowmapper.app
          releaseFiles: apple-app/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  # Installs the APK on an Android 16 (API 36) emulator, launches it, presses
  # back, and fails on a crash. The screenshot is kept so you can see what the
  # app showed.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: snowmapper-debug-apk
          path: apk

      - name: Enable KVM (hardware-accelerated emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash apple-app/scripts/android-smoke.sh apk/app-debug.apk smoke

      - name: Keep screenshot + logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-test
          path: smoke/
          if-no-files-found: ignore
          retention-days: 14
