# Variant A live: one SNOWPACK cycle for today, carrying the snowpack from the
# previous cycle.
#
# Storage is GitHub itself -- no server, no bucket:
#   va-state  the snowpack of every virtual slope (state.tar.gz), valid at the
#             start of the last window. Restored at the start of each cycle,
#             uploaded again at the end, even when the gates fail (the state
#             is still the best estimate of the snowpack). It is one
#             continuous run from bare ground on 1 September (config.py,
#             season_start) and carries the season's drift history. Kept 35
#             days, so even a month without cycles loses nothing: the next
#             cycle integrates over the gap. The "Variant A season replay"
#             workflow rebuilds it from the season start if it is ever lost.
#   va-live   the export the app reads. Uploaded ONLY when the publish gates
#             pass; the deploy picks the newest one, so a bad cycle simply
#             leaves the previous good one online.
name: Variant A live
# a cycle meant as one of the four a day -- GitHub's cron or the Cloudflare
# cron (input "cron") -- carries this title; the guard looks for it
run-name: ${{ (github.event_name == 'schedule' || inputs.cron) && 'Variant A live · scheduled' || 'Variant A live' }}

on:
  schedule:
    # ~40 min after the 00/06/12/18 UTC ICON-CH2 runs appear upstream.
    - cron: "40 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Weather points (blank = all ~135)"
        default: ""
        required: false
      reset_state:
        description: "Ignore the carried snowpack and cold-start"
        type: boolean
        default: false
      use_ogd:
        # Verified against Open-Meteo on a runner (T r 0.95-0.98, wind bias
        # ~0, radiation within 10-25 %). On by default; if the extraction
        # fails the cycle simply runs on Open-Meteo.
        description: "Put MeteoSwiss OGD ICON-CH1/CH2 over the forecast hours"
        type: boolean
        default: true
      cron:
        # Set by the Cloudflare Worker's Cron Trigger (tiles/worker,
        # scheduled()): GitHub's own schedule runs up to hours late or drops a
        # cycle, the Worker starts it on the minute. Counts as scheduled.
        description: "Started by the Cloudflare cron (counts as a scheduled cycle)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: variant-a-live
  cancel-in-progress: false

env:
  SNOWPACK_REF: master
  PREFIX: ${{ github.workspace }}/snowpack-build/install

jobs:
  # Each scheduled cycle is started twice -- on the minute by the Cloudflare
  # cron, and whenever GitHub's own cron gets to it. The second one stands
  # down when the first has its cycle running or done in the last 5 h (one
  # that failed is run again) and cancels itself, so no deploy follows it.
  # Manual runs always go ahead.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=true
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.cron }}" = "true" ]; then
            SINCE=$(date -u -d '-300 minutes' +%Y-%m-%dT%H:%M:%SZ)
            for R in $(gh api -X GET "repos/${{ github.repository }}/actions/workflows/variant-a-live.yml/runs" \
                         -f created=">=$SINCE" -f per_page=20 \
                         --jq '.workflow_runs[] | select(.id != ${{ github.run_id }} and .display_title == "Variant A live · scheduled") | .id' 2>/dev/null); do
              if gh api "repos/${{ github.repository }}/actions/runs/$R/jobs" \
                   --jq '.jobs[] | select(.name == "cycle" and (.status != "completed" or .conclusion == "success")) | .id' 2>/dev/null | grep -q .; then
                RUN=false; echo "this cycle already runs or ran: run $R"; fi
            done
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"; echo "run this cycle: $RUN"
          if [ "$RUN" = false ]; then
            echo "### Stood down: this cycle was already started" >> "$GITHUB_STEP_SUMMARY"
            gh run cancel ${{ github.run_id }} -R "${{ github.repository }}" || true
          fi

  cycle:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}   # the repository variable RUNNER (e.g. self-hosted), else GitHub's
    timeout-minutes: 300
    outputs:
      daily_tiles: ${{ steps.daily.outputs.go }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Restore SNOWPACK build
        id: spcache
        uses: actions/cache/restore@v4
        with:
          path: snowpack-build/install
          key: snowpack-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ env.SNOWPACK_REF }}-v1

      - name: Build MeteoIO + SNOWPACK
        if: steps.spcache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --depth 1 --branch "$SNOWPACK_REF" \
            https://github.com/snowpack-model/snowpack.git snowpack-build/src
          for m in meteoio snowpack; do
            cmake -S "snowpack-build/src/Source/$m" -B "snowpack-build/b-$m" \
              -DCMAKE_BUILD_TYPE=release -DCMAKE_INSTALL_PREFIX="$PREFIX" \
              -DCMAKE_PREFIX_PATH="$PREFIX" -DMETEOIO_ROOT="$PREFIX"
            cmake --build "snowpack-build/b-$m" -j"$(nproc)"
            cmake --install "snowpack-build/b-$m"
          done
          rm -rf snowpack-build/src snowpack-build/b-*

      - name: Save SNOWPACK build
        if: steps.spcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: snowpack-build/install
          key: snowpack-${{ runner.os }}${{ runner.arch != 'X64' && format('-{0}', runner.arch) || '' }}-${{ env.SNOWPACK_REF }}-v1

      - run: pip install -r requirements.txt

      - name: Restore national DEM
        id: demcache
        uses: actions/cache/restore@v4
        with:
          path: variant_a/data/dem
          key: variant-a-dem-lv03-250m-v1

      - name: Build national DEM from Copernicus
        if: steps.demcache.outputs.cache-hit != 'true'
        run: python tools/make_variant_a_dem.py

      - name: Save national DEM
        if: steps.demcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: variant_a/data/dem
          key: variant-a-dem-lv03-250m-v1

      # The newest va-state artifact of this workflow, whichever run made it
      # (a cycle whose gates failed still saves its state).
      - name: Restore the carried snowpack
        if: ${{ !inputs.reset_state }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p state
          NAME=${{ inputs.limit == '' && 'va-state' || 'va-state-smoke' }}
          RID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$NAME&per_page=20" \
                --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$RID" ]; then
            gh run download "$RID" -n "$NAME" -D state && ls -la state
            echo "::notice::continuing from the state of run $RID"
          else
            echo "::notice::no carried state -- cold start"
          fi

      # MeteoSwiss open data for the forecast hours, in its own venv
      # (meteodata-lab pins numpy < 2.4). Best effort: without it the cycle
      # runs on Open-Meteo alone, which serves the same ICON-CH models.
      - name: MeteoSwiss OGD forecast at the weather points
        if: ${{ github.event_name == 'schedule' || inputs.cron || inputs.use_ogd }}
        continue-on-error: true
        run: |
          python -m venv .ogd && .ogd/bin/pip install -q meteodata-lab && .ogd/bin/python tools/test_ogd_extract.py
          ARGS="--live --write-points points.json"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          python run_variant_a.py $ARGS
          TQDM_DISABLE=1 .ogd/bin/python -u tools/ogd_extract.py points.json ogd

      - name: Run the cycle
        id: cycle
        env:
          SNOWPACK_BIN: ${{ github.workspace }}/snowpack-build/install/bin/snowpack
          SNOWPACK_LIBS: ${{ github.workspace }}/snowpack-build/install/lib
          # community reports nudge precipitation only when this repository
          # variable is "1" (and the held-out reports agree); else shadow mode
          COMMUNITY_APPLY: ${{ vars.COMMUNITY_APPLY || '0' }}
        run: |
          set -o pipefail
          ARGS="--live --state-dir state --state-out state_new --step-h 2"
          [ -d ogd ] && ARGS="$ARGS --ogd-dir ogd"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          echo "run_variant_a.py $ARGS"
          set +e
          python -u run_variant_a.py $ARGS 2>&1 | tee run.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          # 3 = ran fine, gates failed: keep the state, do not publish
          if [ "$RC" != "0" ] && [ "$RC" != "3" ]; then exit "$RC"; fi

      # Model vs the SLF IMIS stations over the whole season (drift.py):
      # verdict in the job summary, a warning/error annotation when the
      # snowpack drifts, the chart on the site (data/variant_a_live/drift.html).
      - name: Drift check
        if: always() && steps.cycle.outputs.rc != ''
        run: python tools/drift_check.py outputs/variant_a/drift.json

      - name: Upload the new state
        if: always() && hashFiles('state_new/state.tar.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          # smoke runs keep their own state line, so they never replace the
          # national one the scheduled cycles carry
          name: ${{ inputs.limit == '' && 'va-state' || 'va-state-smoke' }}
          path: state_new/state.tar.gz
          retention-days: 35
          compression-level: 0

      # Only a full cycle is publishable: a --limit smoke run must never end
      # up in the app (the deploy takes the newest va-live).
      - name: Upload the export (gates passed, full run only)
        if: steps.cycle.outputs.rc == '0' && inputs.limit == ''
        uses: actions/upload-artifact@v4
        with:
          name: va-live
          path: outputs/variant_a/
          retention-days: 5

      # Once a day this cycle's export also goes to the tile service (job
      # "tiles" below): the first published scheduled cycle that ends between
      # 14 and 20 UTC -- the forecast the next day is planned with. A run is
      # ~19 000 R2 writes; once a day stays inside Cloudflare's free plan.
      # The other cycles replace that export as usual (the map then renders
      # zoomed in on the device again).
      - name: Daily tiles?
        id: daily
        if: (github.event_name == 'schedule' || inputs.cron) && steps.cycle.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(date -u +%H); GO=false
          if [ "$((10#$H))" -ge 14 ] && [ "$((10#$H))" -lt 20 ]; then
            GO=true
            for R in $(gh api -X GET "repos/${{ github.repository }}/actions/workflows/variant-a-live.yml/runs" \
                         -f created=">=$(date -u +%F)" -f per_page=20 \
                         --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id' 2>/dev/null); do
              if gh api "repos/${{ github.repository }}/actions/runs/$R/jobs" \
                   --jq '.jobs[] | select((.name | startswith("tiles")) and .conclusion == "success") | .id' 2>/dev/null | grep -q .; then
                GO=false; echo "tiles already published today (run $R)"; fi
            done
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"; echo "daily tiles: $GO (cycle ended $H UTC)"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Variant A live cycle"
            if [ -f outputs/variant_a/gates.json ]; then
              python - <<'PY'
          import json
          g = json.load(open("outputs/variant_a/gates.json"))
          m = json.load(open("outputs/variant_a/manifest.json"))
          print(f"**Gates: {'passed' if g['passed'] else 'FAILED'}**  (run success {g['run_success']:.1%})\n")
          for h in g["hard"]: print(f"- HARD: {h}")
          for s in g["soft"]: print(f"- {s}")
          st = m.get("state") or {}
          print(f"\nState: from {st.get('from')} to {st.get('to')}, carried {st.get('carried')}/{st.get('runs')}")
          print(f"Frames: {len(m.get('tags', []))}, models: {m.get('forcing_models')}")
          v = (m.get("validation") or {}).get("imis") or {}
          print(f"IMIS: {v}")
          c = (m.get("validation") or {}).get("community") or {}
          print(f"\nCommunity: {c.get('observations', 0)} observations from {c.get('users', 0)} people, "
                f"mode {c.get('mode', '-')}, applied {c.get('applied', False)}; "
                f"powder depth {c.get('powder_depth')}; hit rates {c.get('hit_rate')}; holdout {c.get('holdout_check')}")
          PY
            fi
            grep -oP '(?<=^\[timing\] ).*' run.log | tail -1 | sed 's/^/Timing: /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when the gates failed
        if: steps.cycle.outputs.rc == '3'
        run: |
          echo "::error::publish gates failed -- the previous cycle stays online"
          exit 1

  # The daily sharp tiles (see "Daily tiles?"): the Cloudflare workflow,
  # called with this run's export. It never fails the run -- a tile problem
  # leaves the forecast publishable and the map renders on the device -- and
  # the site deploy, which follows this whole workflow, then carries the
  # tiles. Pre-rendered: 24 h centred 10 h ahead (about now-2 h .. now+22 h).
  tiles:
    needs: cycle
    if: needs.cycle.outputs.daily_tiles == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/cloudflare.yml
    with:
      publish: true
      source: live
      prerender_hours: "24"
      prerender_shift: "10"
      views: ski6,powder
      same_run: true
    secrets: inherit
