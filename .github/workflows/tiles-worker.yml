name: Tiles worker

# The Cloudflare Worker that renders SNOWPACK map tiles (tiles/worker). Runs
# its test on every change and deploys to Cloudflare when the secrets exist:
#   secrets.CLOUDFLARE_API_TOKEN  (permission: Workers Scripts edit, R2 read/write)
#   secrets.CLOUDFLARE_ACCOUNT_ID
# The engine inside it is cut from the app build, so the Worker is redeployed
# whenever the app's engine changes.

on:
  push:
    branches: [main]
    paths:
      - 'tiles/worker/**'
      - 'pipeline/interactive_export.py'
      - 'tools/make_va_engine.py'
      - '.github/workflows/tiles-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Build the app (offline) and cut the engine out of it
        run: |
          mkdir -p dist
          python run_interactive.py --split --offline --date 2026-04-01 --res 4000 --out-dir dist
          python tools/make_va_engine.py dist/app.js tiles/worker/src/va_engine.js
      - name: Install worker dependencies
        working-directory: tiles/worker
        run: npm ci --no-audit --no-fund
      - name: Test against the committed demo export
        working-directory: tiles/worker
        run: node test/test_worker.mjs ../../variant_a_export
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main'
        working-directory: tiles/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets not set -- tested, not deployed."; exit 0; fi
          npx wrangler deploy
