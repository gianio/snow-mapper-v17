name: Build and deploy snow model

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"     # 05:00 CEST
    - cron: "0 9 * * *"     # 11:00 CEST
    - cron: "27 13 * * *"   # 15:27 CEST
    - cron: "0 16 * * *"    # 18:00 CEST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgdal-dev libproj-dev gdal-bin

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Powder-engine regression (offline)
        # Activates automatically once tools/cache/ is committed (generate it
        # once online with `python tools/eval_powder.py`, then commit the cache).
        # Until then this is a no-op so the build stays green.
        run: |
          if [ -d tools/cache ]; then
            python tools/eval_powder.py --offline
          else
            echo "tools/cache/ not present — skipping powder regression."
          fi

      - name: Generate app shell + data blob
        # Split build: small stable shell (index.html + app.js) + a separate
        # data/ blob behind latest.json, so daily data updates don't rebuild the
        # shell. Writes manifest/sw/icons into dist too.
        run: |
          mkdir -p dist
          python run_interactive.py --split --res 3000 --out-dir dist
          # Demo-Datensatz: ECHTE Wetterdaten vom 1. April 2026 (ERA5-Archiv
          # via archive-api.open-meteo.com; _select_endpoint waehlt es
          # automatisch fuer alte Daten). Faellt bei API-Problemen auf
          # synthetisch zurueck, damit der Deploy nie an der Demo scheitert.
          python run_interactive.py --split --date 2026-04-01 --res 3000 --out-dir dist_demo \
            || python run_interactive.py --split --offline --date 2026-04-01 --res 3000 --out-dir dist_demo
          cp dist_demo/data/snowdata-*.json dist/data/demo.json
          cp dist_demo/data/snowdata-*.json.gz dist/data/demo.json.gz
          python -c "import json;json.dump({'version':'demo-20260401','data':'demo.json','gz':'demo.json.gz'},open('dist/data/demo-latest.json','w'))"
          touch dist/.nojekyll

      - name: Validate JS (node --check)
        run: |
          python tools/check_inline_js.py dist/index.html
          node --check dist/app.js

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
