name: Build and deploy snow model

# Rebuilt after a merge to main, by hand, after a (hand-started) Cloudflare
# tiles run, and after every successful Variant A live cycle (4x a day): that
# is what brings fresh weather and the new SNOWPACK run onto the site --
# without it the forecast stayed as old as the last merge.
on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Cloudflare tiles", "Variant A live"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read          # to download the newest va-live artifact

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # after a Cloudflare tiles / Variant A run, only when it succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    # The critical step alone (shell + live data at res 3000) runs ~27 min, and
    # the optional demo build may add up to 13 more. At 30 the job was being
    # killed part-way through the demo step, which SKIPS everything after it --
    # including upload-pages-artifact -- so the site silently stopped
    # redeploying while every run still reported "cancelled" rather than failed.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # rasterio and fiona bring their own GDAL in the wheel; these are a
      # fallback only. A hung package mirror stalled whole runs for the
      # job's limit, so: bounded, and never fatal.
      - name: Install system dependencies
        timeout-minutes: 6
        continue-on-error: true
        run: |
          timeout 150 sudo apt-get update -qq || echo '::warning::apt-get update failed'
          timeout 180 sudo apt-get install -y -qq libgdal-dev libproj-dev gdal-bin || echo '::warning::apt-get install failed -- using the wheels GDAL'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Powder-engine regression (offline)
        # Activates automatically once tools/cache/ is committed (generate it
        # once online with `python tools/eval_powder.py`, then commit the cache).
        # Until then this is a no-op so the build stays green.
        run: |
          if [ -d tools/cache ]; then
            python tools/eval_powder.py --offline
          else
            echo "tools/cache/ not present — skipping powder regression."
          fi

      - name: Generate app shell + live data blob
        # Split build: small stable shell (index.html + app.js) + a separate
        # data/ blob behind latest.json, so daily data updates don't rebuild the
        # shell. Writes manifest/sw/icons into dist too. This is the CRITICAL
        # path — the deploy must always get here.
        env:
          # optional: Windy Webcams API key for the webcam layer (public client key)
          WINDY_WEBCAMS_KEY: ${{ secrets.WINDY_WEBCAMS_KEY }}
        run: |
          mkdir -p dist
          python run_interactive.py --split --res 1000 --gz-only --out-dir dist
          touch dist/.nojekyll

      # The 1 April 2026 demo dataset is HISTORICAL and never changes, so we
      # build it once (real ERA5 archive weather) and cache it. Re-fetching
      # ~1200 archive points on every run (4x/day) is what blew past the old
      # 15-min timeout and cancelled the deploy.
      #
      # v1 -> v2: whichever run first populated the v1 cache did so while
      # 2026-04-01 was still in the future -- _select_endpoint() (run_pipeline.py)
      # only switches to the ERA5 archive once the target date is more than
      # ARCHIVE_THRESHOLD_DAYS (80) in the past, so that build silently used the
      # regular forecast endpoint instead, which has no real skill that far out
      # and returned wrong/low-quality data for the "historical" date. Bumping
      # the key forces one real rebuild; today the date genuinely is >80 days
      # old, so this run resolves to the archive endpoint correctly. Do not
      # bump this again for no reason -- it is what makes the demo dataset
      # NOT get re-fetched on every deploy.
      #
      # v3 -> v4: the blob gained the cloud-cover field (CLOUD), and the v3
      # copy predated the tour routes -- one rebuild brings both into demo mode.
      - name: Restore demo dataset (historical, static)
        id: demo-cache
        uses: actions/cache/restore@v4
        with:
          path: dist_demo
          key: demo-dataset-20260401-res1000-ws02-v4

      - name: Build demo dataset (real ERA5 archive, cache miss only)
        # Best-effort + time-bounded: if the archive fetch is slow/rate-limited
        # it is killed and dist_demo is removed so nothing partial is cached;
        # the deploy still succeeds and demo mode falls back to live data
        # (handled in the boot loader) until a later run caches it.
        #
        # weather-step 0.1 -> 0.2: at 0.1 deg this step queries ~4x the points
        # of the live build (which uses the 0.2 default) while ALSO hitting the
        # slower ERA5 archive endpoint for an 11-day window -- that combination
        # never finished inside the old 780s budget (confirmed: the step ran
        # the full 13 min with zero log output, got killed, and dist_demo was
        # discarded every single run). Matching the live build's weather-step
        # keeps the same interpolation quality already used for production
        # data every day, while cutting the point count back to what actually
        # finishes in time. `python -u` so a future timeout still shows
        # progress in the log instead of buffered silence.
        if: steps.demo-cache.outputs.cache-hit != 'true'
        # A step timeout fails the STEP; a job timeout kills the run and skips
        # the deploy. This step is optional, so it must never be the thing that
        # ends the job -- hence its own bound on top of the inner `timeout`.
        timeout-minutes: 27
        continue-on-error: true
        run: |
          timeout 1500 python -u run_interactive.py --split --date 2026-04-01 --res 1000 --gz-only --weather-step 0.2 --out-dir dist_demo \
            || { echo "demo build slow/failed — leaving it out, app uses live data in demo mode"; rm -rf dist_demo; }

      # Saving is split from restoring on purpose. actions/cache saves in a post
      # step that runs even when the build step was KILLED by its timeout -- and
      # a half-written dist_demo stored under this fixed key would be restored
      # as a cache hit forever after, so the dataset would never be rebuilt.
      # This only saves what the build actually finished.
      # The build writes only snowdata-*.json.gz (--gz-only). This check used
      # to look for the plain .json, so the cache was never saved and the
      # ~13 min demo build ran again on every deploy.
      - name: Cache the demo dataset (only when it completed)
        if: steps.demo-cache.outputs.cache-hit != 'true' && hashFiles('dist_demo/data/snowdata-*.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: dist_demo
          key: demo-dataset-20260401-res1000-ws02-v4

      - name: Assemble demo dataset into dist (if present)
        run: |
          if ls dist_demo/data/snowdata-*.json.gz >/dev/null 2>&1; then
            cp dist_demo/data/snowdata-*.json.gz dist/data/demo.json.gz
            # --gz-only no longer writes the plain blob; copy it only if present
            # so the pointer never names a file that is not there.
            if ls dist_demo/data/snowdata-*.json >/dev/null 2>&1; then
              cp dist_demo/data/snowdata-*.json dist/data/demo.json
              python -c "import json;json.dump({'version':'demo-20260401','data':'demo.json','gz':'demo.json.gz'},open('dist/data/demo-latest.json','w'))"
            else
              python -c "import json;json.dump({'version':'demo-20260401','gz':'demo.json.gz'},open('dist/data/demo-latest.json','w'))"
            fi
            # the binary container the boot loader prefers (made from the
            # cached JSON, so an older demo cache needs no rebuild)
            python tools/blob_to_bin.py dist/data/demo.json.gz dist/data/demo.bin.gz \
              && python -c "import json;p='dist/data/demo-latest.json';j=json.load(open(p));j['bin']='demo.bin.gz';json.dump(j,open(p,'w'))" \
              || echo "demo: no binary copy, the JSON one is used"
            echo "demo dataset assembled into dist/data/."
          else
            echo "no demo dataset this run — demo mode falls back to live data."
          fi

      # Variant A (SNOWPACK ski quality) is computed OFFLINE -- it needs an
      # external SNOWPACK binary and a DEM that is not in the repo, so it
      # cannot run here. If its exported artifacts have been committed under
      # variant_a_export/, publish them; otherwise the app hides the layer.
      - name: Assemble Variant A artifacts (if committed)
        run: |
          if [ -f variant_a_export/manifest.json ]; then
            mkdir -p dist/data/variant_a
            cp -r variant_a_export/. dist/data/variant_a/
            echo "Variant A: $(du -sh dist/data/variant_a | cut -f1) published."
          else
            echo "Variant A: no variant_a_export/manifest.json — layer stays hidden."
          fi

      # The newest live cycle that passed its publish gates (va-live is only
      # uploaded then). Live mode reads it from data/variant_a_live; without
      # one the app falls back to the demo export above.
      - name: Assemble Variant A live cycle (newest passing artifact)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RID=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=va-live&per_page=20" \
                --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          if [ -n "$RID" ]; then
            mkdir -p dist/data/variant_a_live
            gh run download "$RID" -n va-live -D dist/data/variant_a_live
            echo "Variant A live: run $RID, $(du -sh dist/data/variant_a_live | cut -f1)"
          else
            echo "Variant A live: no passing cycle yet — live mode uses the demo export."
          fi

      - name: Validate JS (node --check)
        run: |
          python tools/check_inline_js.py dist/index.html
          node --check dist/app.js

      - name: Terrain + model tests
        # Aspect maths (synthetic tilted planes) and the snow-prognosis
        # scoring model, extracted from the built app.js.
        run: |
          python tools/test_aspect.py
          python tools/test_ablation.py
          node tools/test_model.js dist/app.js
          node tools/test_engine.js dist/engine.js
          node tools/test_tour_js.js dist/engine.js

      # Only now, after the tests: they read the model block out of app.js by
      # its marker comments, which minifying removes. Best effort -- without
      # esbuild, or if the result fails node --check, the readable files stay.
      - name: Minify app.js and the inline CSS
        run: |
          npm install -g esbuild@0.24.0 >/dev/null 2>&1 || echo "esbuild not installed -- shipping readable app.js"
          python -c "from pathlib import Path; from pipeline.interactive_export import minify_shell; minify_shell(Path('dist'))"
          node --check dist/app.js
          python tools/check_inline_js.py dist/index.html

      - name: Report published site size
        # GitHub Pages refuses a site over 1 GB, and it counts the
        # UNCOMPRESSED blob -- which is exactly why --gz-only exists. Fail
        # loudly here rather than at upload time.
        run: |
          SZ=$(du -sm dist | cut -f1)
          echo "dist is ${SZ} MB"
          du -sh dist/data/* | sort -h | tail -5
          if [ "$SZ" -gt 900 ]; then
            echo "::error::dist is ${SZ} MB — GitHub Pages limit is 1 GB. Lower --res or keep --gz-only."
            exit 1
          fi

      # Cloudflare Pages: free, also from a private repository. On when the
      # repository variable CF_PAGES_PROJECT names the Pages project; the
      # token and account are the ones the tiles workflow uses. Pages takes
      # at most 20 000 files and 25 MiB per file -- checked first.
      - name: Deploy to Cloudflare Pages
        if: vars.CF_PAGES_PROJECT != ''
        continue-on-error: ${{ vars.GH_PAGES != 'off' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          N=$(find dist -type f | wc -l)
          BIG=$(find dist -type f -size +25M)
          echo "dist: $N files"
          if [ "$N" -gt 20000 ]; then echo "::error::Cloudflare Pages takes at most 20000 files ($N)"; exit 1; fi
          if [ -n "$BIG" ]; then echo "::error::Cloudflare Pages takes files up to 25 MiB:"; echo "$BIG"; exit 1; fi
          npx --yes wrangler@3 pages deploy dist --project-name "${{ vars.CF_PAGES_PROJECT }}" --branch main --commit-dirty=true

      # GitHub Pages, unless the repository variable GH_PAGES is 'off' (a
      # private repository needs GitHub Pro for it)
      - uses: actions/upload-pages-artifact@v5
        if: vars.GH_PAGES != 'off'
        with:
          path: ./dist

  deploy:
    needs: build
    if: vars.GH_PAGES != 'off'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
