name: Build and deploy snow model

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * *"     # 05:00 CEST
    - cron: "0 9 * * *"     # 11:00 CEST
    - cron: "27 13 * * *"   # 15:27 CEST
    - cron: "0 16 * * *"    # 18:00 CEST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgdal-dev libproj-dev gdal-bin

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Powder-engine regression (offline)
        # Activates automatically once tools/cache/ is committed (generate it
        # once online with `python tools/eval_powder.py`, then commit the cache).
        # Until then this is a no-op so the build stays green.
        run: |
          if [ -d tools/cache ]; then
            python tools/eval_powder.py --offline
          else
            echo "tools/cache/ not present — skipping powder regression."
          fi

      - name: Generate static site
        run: |
          python run_interactive.py
          mkdir -p dist
          mv index.html dist/
          touch dist/.nojekyll

      - name: Validate inline JS (node --check)
        run: python tools/check_inline_js.py dist/index.html

      - name: Add PWA assets to the deploy bundle
        run: |
          for f in manifest.webmanifest sw.js icon-180.png icon-192.png icon-512.png; do
            [ -f "$f" ] && mv "$f" dist/ || true
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
