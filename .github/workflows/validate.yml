name: Validate (PR)

# deploy.yml only runs on pushes to main, so pull requests previously had no
# checks at all. This builds the app offline (no network data fetches) and runs
# the terrain + model test suites, so a PR shows green/red before merging.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgdal-dev libproj-dev gdal-bin

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Terrain aspect unit test
        run: python tools/test_aspect.py

      - name: Ablation unit test
        run: python tools/test_ablation.py

      - name: SLF bulletin parser unit test
        run: python tools/test_slf_bulletin.py

      - name: Tour powder score unit test
        run: python tools/test_tour_score.py

      # Upstream shape check. The agent build environment cannot reach
      # aws.slf.ch or data.geo.admin.ch (egress policy, 403 at the proxy), so
      # the bulletin and route parsers are fixture-tested only. A runner can
      # reach them, so confirm the REAL response shape here.
      #
      # Never blocking: an SLF outage or a swisstopo schema change must not
      # fail an unrelated PR. It reports, the suites above enforce.
      # Deliberately light -- two small GETs, no bulk download.
      - name: Upstream shape check (non-blocking)
        continue-on-error: true
        run: python tools/probe_upstreams.py

      - name: Build app (offline, synthetic data)
        run: |
          mkdir -p dist
          python run_interactive.py --split --offline --date 2026-04-01 --res 4000 --out-dir dist

      - name: Validate JS
        run: |
          python tools/check_inline_js.py dist/index.html
          node --check dist/app.js

      - name: Snow-prognosis model test
        run: node tools/test_model.js dist/app.js

      - name: Standalone engine module
        # Checks dist/engine.js loads and scores with no DOM — this is the exact
        # file a native iOS app runs in JavaScriptCore.
        run: node tools/test_engine.js dist/engine.js

      # Needs dist/engine.js, so it has to come AFTER the build step -- it was
      # briefly placed with the other unit tests above, which run before the
      # app is built, and failed on a missing file.
      - name: Tour powder score (engine build)
        run: node tools/test_tour_js.js dist/engine.js

      - name: Variant A consumer contract
        run: node tools/test_variant_a.js dist/app.js
