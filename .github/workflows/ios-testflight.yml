name: iOS build (TestFlight)

# Manual only, on purpose. The native iOS project (apple-app/ios/) is NOT in the
# repo -- Capacitor generates it from capacitor.config.ts on every run, so there
# is no Xcode project to keep in sync and no generated files to review.
#
# This exists so shipping an iOS build does not require a Mac on your desk.
# It needs four secrets before it can sign anything (see "Secrets" below); with
# `upload: false` it runs without any of them and just proves the build works.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload to TestFlight (needs the signing secrets)"
        type: boolean
        default: false
      offline:
        description: "Build with synthetic weather instead of live data"
        type: boolean
        default: false
      remote_data_base:
        description: "Origin the shipped app fetches fresh forecast data from"
        type: string
        default: "https://gianio.github.io/snow-mapper-v17"

# Secrets required for upload: true
#   APPLE_CERTIFICATE_P12       base64 of your Apple Distribution .p12
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_PROVISIONING_PROFILE  base64 of the App Store .mobileprovision
#   APPSTORE_API_KEY_JSON       App Store Connect API key as JSON:
#                               {"key_id":"…","issuer_id":"…","key":"-----BEGIN…"}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: brew install gdal proj

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Same pipeline that builds the web app, so the iOS bundle and the website
      # come from one source. The bundled dataset is the offline seed; the app
      # fetches fresher data from remote_data_base at launch.
      - name: Build web assets into apple-app/www
        working-directory: apple-app
        env:
          SNOW_OFFLINE: ${{ inputs.offline && '1' || '0' }}
          SNOW_REMOTE_DATA_BASE: ${{ inputs.remote_data_base }}
        run: |
          npm install
          npm run build:web

      - name: Validate the built web assets
        run: |
          python tools/check_inline_js.py apple-app/www/index.html
          node --check apple-app/www/app.js

      - name: Generate icon + splash from the brand artwork
        working-directory: apple-app
        run: python3 scripts/make-resources.py

      - name: Generate the native iOS project
        working-directory: apple-app
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios

      # cap add ios writes a stock Info.plist; the camera/photo/location purpose
      # strings are mandatory (Apple rejects the build without them) and the
      # privacy manifest is required for App Store submission.
      - name: Apply iOS config (purpose strings + privacy manifest)
        working-directory: apple-app
        run: |
          python3 scripts/apply-ios-config.py

      - name: Build unsigned (smoke test)
        if: ${{ !inputs.upload }}
        working-directory: apple-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Import signing assets
        if: ${{ inputs.upload }}
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$P12" ] || [ -z "$PROFILE" ]; then
            echo "::error::upload=true but the signing secrets are not set."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/app.mobileprovision"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive and export
        if: ${{ inputs.upload }}
        working-directory: apple-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          API_KEY_JSON: ${{ secrets.APPSTORE_API_KEY_JSON }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_ID="$(echo "$API_KEY_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["key_id"])')"
          ISSUER_ID="$(echo "$API_KEY_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["issuer_id"])')"
          echo "$API_KEY_JSON" | python3 -c 'import json,sys;sys.stdout.write(json.load(sys.stdin)["key"])' \
            > "$HOME/private_keys/AuthKey_$KEY_ID.p8"
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -rf "$HOME/private_keys"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            apple-app/www/index.html
            ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
          retention-days: 7
