name: iOS build (TestFlight)

# Manual only, on purpose. The native iOS project (apple-app/ios/) is NOT in the
# repo -- Capacitor generates it from capacitor.config.ts on every run, so there
# is no Xcode project to keep in sync and no generated files to review.
#
# This exists so shipping an iOS build does not require a Mac on your desk.
# It needs four secrets before it can sign anything (see "Secrets" below); with
# `upload: false` it runs without any of them and just proves the build works.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Sign and upload to TestFlight (needs the signing secrets)"
        type: boolean
        default: false
      offline:
        description: "Build with synthetic weather instead of live data"
        type: boolean
        default: false
      remote_data_base:
        description: "Origin the shipped app fetches fresh forecast data from"
        type: string
        default: "https://gianio.github.io/snow-mapper-v17"
      version:
        description: "App version shown in the App Store (CFBundleShortVersionString)"
        type: string
        default: "1.0.0"
      build_number:
        description: "Build number (empty = this workflow's run number; must grow with every upload)"
        type: string
        default: ""

# Secrets required for upload: true
#   APPLE_CERTIFICATE_P12       base64 of your Apple Distribution .p12
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_PROVISIONING_PROFILE  base64 of the App Store .mobileprovision
#   APPSTORE_API_KEY_JSON       App Store Connect API key as JSON:
#                               {"key_id":"…","issuer_id":"…","key":"-----BEGIN…"}
# The team id and the profile name are read from the profile itself; the
# build number is the run number. Step by step: docs/testflight-anleitung.md

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system dependencies
        run: brew install gdal proj

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Same pipeline that builds the web app, so the iOS bundle and the website
      # come from one source. The bundled dataset is the offline seed; the app
      # fetches fresher data from remote_data_base at launch.
      - name: Build web assets into apple-app/www
        working-directory: apple-app
        env:
          SNOW_OFFLINE: ${{ inputs.offline && '1' || '0' }}
          SNOW_REMOTE_DATA_BASE: ${{ inputs.remote_data_base }}
        run: |
          npm install
          npm run build:web

      - name: Validate the built web assets
        run: |
          python tools/check_inline_js.py apple-app/www/index.html
          node --check apple-app/www/app.js

      - name: Generate icon + splash from the brand artwork
        working-directory: apple-app
        run: python3 scripts/make-resources.py

      - name: Generate the native iOS project
        working-directory: apple-app
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios

      # cap add ios writes a stock Info.plist; the camera/photo/location purpose
      # strings are mandatory (Apple rejects the build without them) and the
      # privacy manifest is required for App Store submission.
      - name: Apply iOS config (purpose strings + privacy manifest)
        working-directory: apple-app
        run: |
          python3 scripts/apply-ios-config.py

      - name: Build unsigned (smoke test)
        if: ${{ !inputs.upload }}
        working-directory: apple-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Import signing assets
        if: ${{ inputs.upload }}
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          API_KEY_JSON: ${{ secrets.APPSTORE_API_KEY_JSON }}
        run: |
          if [ -z "$P12" ] || [ -z "$PROFILE" ] || [ -z "$API_KEY_JSON" ]; then
            echo "::error::upload=true but a signing secret is missing (APPLE_CERTIFICATE_P12, APPLE_PROVISIONING_PROFILE, APPSTORE_API_KEY_JSON)."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          # The profile tells us everything else: its UUID, name and team.
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$RUNNER_TEMP/profile.plist")"
          TEAM="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          APPID="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")"
          case "$APPID" in
            *ch.snowmapper.app) ;;
            *) echo "::error::The provisioning profile is for '$APPID', not ch.snowmapper.app."; exit 1;;
          esac
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/app.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          echo "Signing with profile '$NAME' ($UUID), team $TEAM"

      - name: Configure signing, version and build number
        if: ${{ inputs.upload }}
        working-directory: apple-app
        run: |
          BUILD="${{ inputs.build_number }}"
          [ -n "$BUILD" ] || BUILD="${{ github.run_number }}"
          python3 scripts/ci-signing.py --team "$TEAM_ID" --profile "$PROFILE_NAME" \
            --version "${{ inputs.version }}" --build "$BUILD"

      - name: Archive and export
        if: ${{ inputs.upload }}
        working-directory: apple-app/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>ch.snowmapper.app</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          mkdir -p "$GITHUB_WORKSPACE/ipa" && cp "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/ipa/"

      # The signed .ipa is kept as a download too: if the upload below ever
      # fails, it can go up by hand with Apple's Transporter app.
      - name: Keep the signed .ipa
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: snowmapper-ipa
          path: ipa/*.ipa
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          API_KEY_JSON: ${{ secrets.APPSTORE_API_KEY_JSON }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_ID="$(echo "$API_KEY_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["key_id"])')"
          ISSUER_ID="$(echo "$API_KEY_JSON" | python3 -c 'import json,sys;print(json.load(sys.stdin)["issuer_id"])')"
          echo "$API_KEY_JSON" | python3 -c 'import json,sys;sys.stdout.write(json.load(sys.stdin)["key"])' \
            > "$HOME/private_keys/AuthKey_$KEY_ID.p8"
          IPA="$(ls "$GITHUB_WORKSPACE"/ipa/*.ipa | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -rf "$HOME/private_keys"
          echo "### Uploaded to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "Version ${{ inputs.version }} – the build appears under TestFlight after Apple's processing (usually 10–30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            apple-app/www/index.html
            ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
          retention-days: 7
